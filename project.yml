name: ZettaStream
options:
  bundleIdPrefix: io.github.stivengjekaj
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
packages:
  ZettaCore:
    path: ZettaCore
  VLCKit:
    url: https://github.com/videolan/vlckit
    revision: 2e0868f5ed40fe59cd92f377645fdcc260c6e759
targets:
  ZettaStream:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: ZettaCore
      - package: VLCKit
      # The torrent engine. scripts/build-torrent.sh builds it. gomobile makes
      # a static framework, so the app links it and does not embed it.
      - framework: Frameworks/ZettaTorrent.xcframework
        embed: false
      # The Go net package uses the DNS resolver of the system. The uTP
      # library of anacrolix/torrent is C++.
      - sdk: libresolv.tbd
      - sdk: libc++.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.stivengjekaj.zettastream
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: App/Info.plist
  ZettaStreamUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: ZettaStream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.stivengjekaj.zettastream.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: ZettaStream
schemes:
  ZettaStream:
    build:
      targets:
        ZettaStream: all
        ZettaStreamUITests: [test]
    test:
      targets:
        - ZettaStreamUITests
