name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test the core package
        run: swift test --package-path ZettaCore
      # The IPA is a release build. The optimizer can change what the code does,
      # so the tests also run in that configuration.
      - name: Test the core package in a release build
        run: swift test -c release --package-path ZettaCore
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: Torrent/go.mod
          cache-dependency-path: Torrent/go.sum
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          "$(go env GOPATH)/bin/gomobile" init
      - name: Test the torrent engine
        working-directory: Torrent
        run: go test ./...
      - name: Build the IPA
        run: ./scripts/build-ipa.sh
