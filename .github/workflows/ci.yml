name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test the core package
        run: swift test --package-path ZettaCore
      - name: Build the IPA
        run: ./scripts/build-ipa.sh
