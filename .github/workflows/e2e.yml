name: End to end

# Goes through the app in a simulator with real sources, each week and by hand.
# The sources come from the secret ZS_E2E_SOURCES, because the project does not
# recommend any source. With no secret, the tests are skipped.
#
# The workflow keeps no screenshots and no result bundle, because they can show
# the sources.
on:
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: Torrent/go.mod
          cache-dependency-path: Torrent/go.sum
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          "$(go env GOPATH)/bin/gomobile" init
      - name: Build the torrent engine
        run: ./scripts/build-torrent.sh
      - name: Run the UI tests
        env:
          TEST_RUNNER_ZS_E2E_SOURCES: ${{ secrets.ZS_E2E_SOURCES }}
        run: |
          xcodegen --quiet
          device=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone[^(]*\(([0-9A-F-]{36})\)' | grep -oE '[0-9A-F-]{36}')
          # Only the names and the results of the tests go to the log. A failure
          # message can hold the text that a test typed, so it stays out.
          xcodebuild test -project ZettaStream.xcodeproj -scheme ZettaStream \
            -destination "id=$device" -only-testing:ZettaStreamUITests 2>&1 \
            | grep -E "Test Case .*(passed|failed)|TEST (SUCCEEDED|FAILED)" \
            | tee build-result.txt
          grep -q "TEST SUCCEEDED" build-result.txt
